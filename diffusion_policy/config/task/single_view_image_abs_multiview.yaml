name: single_view_image_abs_multiview

# One view of the multi-view zarr (view_06 == azimuth 0 == the original dataset
# camera pose), for the M2 gate: training on this must reproduce the M1
# single-view baseline, which proves the generated multi-view data is trainable
# and not just well-formed. Also the N=1 case M5's encoder must support.
#
# The multi-view generator writes `view_06_image` and `MultiViewImageDataset`
# indexes the zarr by the shape_meta key verbatim, so the key below is a zarr
# array name, not a free label. `task_name` feeds ${task.task_name} in every
# path, so one file serves all three tasks:
#     ... task=single_view_image_abs_multiview task.task_name=lift
shape_meta: &shape_meta
  # acceptable types: rgb, low_dim
  obs:
    view_06_image:
      shape: [3, 84, 84]
      type: rgb
    robot0_eef_pos:
      shape: [3]
      # type default: low_dim
    robot0_eef_quat:
      shape: [4]
    robot0_gripper_qpos:
      shape: [2]
  action:
    shape: [10]

task_name: &task_name square
dataset_type: &dataset_type ph
# source hdf5 (used only to build the evaluation env) and the generated multi-view zarr
hdf5_path: &hdf5_path data/robomimic/datasets/${task.task_name}/${task.dataset_type}/image_abs.hdf5
zarr_path: &zarr_path data/multiview/${task.task_name}_${task.dataset_type}_ring13.zarr
abs_action: &abs_action True

env_runner:
  _target_: diffusion_policy.env_runner.robomimic_image_runner.RobomimicImageRunner
  dataset_path: *hdf5_path
  shape_meta: *shape_meta
  # NOTE: this runner builds obs from shape_meta and the live env only renders
  # `agentview_image`, so it cannot serve `view_06_image`. Rollouts are
  # therefore disabled (training.rollout_every > num_epochs) and evaluation
  # goes through:
  #   python eval_novel_view.py -c <ckpt> -o <out> --serve-obs-key view_06_image
  # which aliases the rendered camera image under the key the policy expects.
  n_train: 6
  n_train_vis: 2
  train_start_idx: 0
  n_test: 50
  n_test_vis: 4
  test_start_seed: 100000
  # use python's eval function as resolver, single-quoted string as argument
  max_steps: ${eval:'500 if "${task.dataset_type}" == "mh" else 400'}
  n_obs_steps: ${n_obs_steps}
  n_action_steps: ${n_action_steps}
  render_obs_key: 'agentview_image'
  fps: 10
  crf: 22
  past_action: ${past_action_visible}
  abs_action: *abs_action
  tqdm_interval_sec: 1.0
  n_envs: 28

dataset:
  _target_: diffusion_policy.dataset.multiview_image_dataset.MultiViewImageDataset
  shape_meta: *shape_meta
  dataset_path: *zarr_path
  horizon: ${horizon}
  pad_before: ${eval:'${n_obs_steps}-1+${n_latency_steps}'}
  pad_after: ${eval:'${n_action_steps}-1'}
  n_obs_steps: ${dataset_obs_steps}
  abs_action: *abs_action
  seed: 42
  val_ratio: 0.02
