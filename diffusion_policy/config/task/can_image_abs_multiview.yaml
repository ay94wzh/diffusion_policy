name: can_image_abs_multiview

# 13 simultaneous views of the same scene state (azimuth ring every 15deg to
# +-90), generated by generate_multiview_dataset.py. Zero-padded so the encoder's
# alphabetical key sort equals numeric view order; view 06 is azimuth 0 (the
# original dataset camera pose).
shape_meta: &shape_meta
  # acceptable types: rgb, low_dim
  obs:
    view_00_image:
      shape: [3, 84, 84]
      type: rgb
    view_01_image:
      shape: [3, 84, 84]
      type: rgb
    view_02_image:
      shape: [3, 84, 84]
      type: rgb
    view_03_image:
      shape: [3, 84, 84]
      type: rgb
    view_04_image:
      shape: [3, 84, 84]
      type: rgb
    view_05_image:
      shape: [3, 84, 84]
      type: rgb
    view_06_image:
      shape: [3, 84, 84]
      type: rgb
    view_07_image:
      shape: [3, 84, 84]
      type: rgb
    view_08_image:
      shape: [3, 84, 84]
      type: rgb
    view_09_image:
      shape: [3, 84, 84]
      type: rgb
    view_10_image:
      shape: [3, 84, 84]
      type: rgb
    view_11_image:
      shape: [3, 84, 84]
      type: rgb
    view_12_image:
      shape: [3, 84, 84]
      type: rgb
    robot0_eef_pos:
      shape: [3]
      # type default: low_dim
    robot0_eef_quat:
      shape: [4]
    robot0_gripper_qpos:
      shape: [2]
  action:
    shape: [10]

task_name: &task_name can
dataset_type: &dataset_type ph
# source hdf5 (used only to build the evaluation env) and the generated multi-view zarr
hdf5_path: &hdf5_path data/robomimic/datasets/${task.task_name}/${task.dataset_type}/image_abs.hdf5
zarr_path: &zarr_path data/multiview/${task.task_name}_${task.dataset_type}_ring13.zarr
abs_action: &abs_action True

env_runner:
  _target_: diffusion_policy.env_runner.robomimic_image_runner.RobomimicImageRunner
  dataset_path: *hdf5_path
  shape_meta: *shape_meta
  # NOTE: this runner builds obs from shape_meta, so it cannot serve view_XX_image
  # keys from a live env. Training therefore disables rollouts (set
  # training.rollout_every above num_epochs). Evaluation goes through
  # eval_novel_view.py with a single camera, once the encoder accepts a subset of
  # view slots (M3).
  n_train: 6
  n_train_vis: 2
  train_start_idx: 0
  n_test: 50
  n_test_vis: 4
  test_start_seed: 100000
  # use python's eval function as resolver, single-quoted string as argument
  max_steps: ${eval:'500 if "${task.dataset_type}" == "mh" else 400'}
  n_obs_steps: ${n_obs_steps}
  n_action_steps: ${n_action_steps}
  render_obs_key: 'agentview_image'
  fps: 10
  crf: 22
  past_action: ${past_action_visible}
  abs_action: *abs_action
  tqdm_interval_sec: 1.0
  n_envs: 28
# evaluation at this config requires a 16 core 64GB instance.

dataset:
  _target_: diffusion_policy.dataset.multiview_image_dataset.MultiViewImageDataset
  shape_meta: *shape_meta
  dataset_path: *zarr_path
  horizon: ${horizon}
  pad_before: ${eval:'${n_obs_steps}-1+${n_latency_steps}'}
  pad_after: ${eval:'${n_action_steps}-1'}
  n_obs_steps: ${dataset_obs_steps}
  abs_action: *abs_action
  seed: 42
  val_ratio: 0.02
