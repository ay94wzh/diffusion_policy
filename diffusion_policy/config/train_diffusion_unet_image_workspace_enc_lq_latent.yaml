defaults:
  - _self_
  - task: enc_lq_image_abs_multiview_az75

name: train_diffusion_unet_image_enc_lq_latent
# Encoder ladder, stage LQ: LVSM RGB+Pluecker 8x8 patchify + EEF-history query
# tokens, one bidirectional transformer, only the query positions read out
# (ENCODER_LVSM_EEF_QUERY_V1.md v0.2).
#
# LQ is a STRUCTURAL candidate against B1/R/RH, not a paired-seed ablation and
# not capacity-matched. It has no ResNet: a shared Conv2d(9, 256, 8, 8) embeds
# [RGB | d | m/L] patches from a 72x72 crop (81 tokens/view). The 84 -> 72
# crop is required because 76 is not divisible by 8; that crop change is part
# of the comparison and a same-crop control is future work.
#
# The workspace uses the LQ-probe subclass: it inherits the standard 128-state
# per-epoch probe and additionally saves query tokens and post-transformer
# visual means. The analysis tool is analyze_latent_series.py (the visualizer
# is not updated for LQ's z_views width).
_target_: diffusion_policy.workspace.train_diffusion_unet_image_workspace_lqprobe.TrainDiffusionUnetImageWorkspaceLQProbe

task_name: ${task.name}
shape_meta: ${task.shape_meta}
exp_name: "default"

horizon: 16
n_obs_steps: 2
n_action_steps: 8
n_latency_steps: 0
dataset_obs_steps: ${n_obs_steps}
past_action_visible: False
keypoint_visible_rate: 1.0
obs_as_global_cond: True

latent_probe:
  # 128 fixed dataset states, encoded every epoch at a full 11-view draw and at
  # the N=1 az_0 inference condition. ring index 6 == az_0 (index 0 is az -90).
  n_states: 128
  seed: 12345
  az0_view: 6
  save_raw: true
  out_dir: latent_snapshots

policy:
  # M3's policy: no per-view aux head, no extra loss. The encoder is LQ.
  _target_: diffusion_policy.policy.diffusion_unet_image_policy.DiffusionUnetImagePolicy

  shape_meta: ${shape_meta}

  noise_scheduler:
    _target_: diffusers.schedulers.scheduling_ddpm.DDPMScheduler
    num_train_timesteps: 100
    beta_start: 0.0001
    beta_end: 0.02
    beta_schedule: squaredcos_cap_v2
    variance_type: fixed_small # Yilun's paper uses fixed_small_log instead, but easy to cause Nan
    clip_sample: True # required when predict_epsilon=False
    prediction_type: epsilon # or sample

  # LQ: one joint bidirectional transformer over the LVSM visual tokens and
  # the EEF-history query tokens; only the 4 query outputs are kept
  # (4 x 128 = 512), then the original 9-d state gives 521. Same dict-in ->
  # (B*To, D) out contract, so the policy and training loop are untouched.
  obs_encoder:
    _target_: diffusion_policy.model.vision.lvsm_eef_query_obs_encoder.LvsmEefQueryObsEncoder
    shape_meta: ${shape_meta}
    d_model: 256
    n_heads: 8
    n_layers: 4
    ffn_dim: 1024             # FFN expansion 4
    dropout: 0.0
    out_token_dim: 128        # 4 x 128 = 512; + 9 state = 521
    patch_size: 8             # LVSM 8x8 RGB+Plucker patches
    crop_shape: [72, 72]      # 84 -> 72 -> 9x9 = 81 tokens/view
    random_crop: True
    imagenet_norm: True       # RGB only; Plucker channels stay raw
    ray_scale: 1.0            # L0: divides the moment AND the query positions
    eef_hist_key: eef_hist_base
    eef_hist_steps: 4
    # Registered controls (design section 8): both keep the parameter set and
    # construction RNG identical.
    history_query: True       # False = zero the query features (constant query)
    visual_reads_history: True  # False = block visual<-history attention

  horizon: ${horizon}
  n_action_steps: ${eval:'${n_action_steps}+${n_latency_steps}'}
  n_obs_steps: ${n_obs_steps}
  num_inference_steps: 100
  obs_as_global_cond: ${obs_as_global_cond}
  # crop_shape: null
  diffusion_step_embed_dim: 128
  down_dims: [512, 1024, 2048]
  kernel_size: 5
  n_groups: 8
  cond_predict_scale: True

  # scheduler.step params
  # predict_epsilon: True

ema:
  _target_: diffusion_policy.model.diffusion.ema_model.EMAModel
  update_after_step: 0
  inv_gamma: 1.0
  power: 0.75
  min_value: 0.0
  max_value: 0.9999

dataloader:
  batch_size: 64
  num_workers: 4
  shuffle: True
  pin_memory: True
  persistent_workers: False

val_dataloader:
  batch_size: 64
  num_workers: 4
  shuffle: False
  pin_memory: True
  persistent_workers: False

optimizer:
  _target_: torch.optim.AdamW
  lr: 1.0e-4
  betas: [0.95, 0.999]
  eps: 1.0e-8
  weight_decay: 1.0e-6

training:
  device: "cuda:0"
  seed: 42
  debug: False
  resume: True
  # optimization
  lr_scheduler: cosine
  lr_warmup_steps: 500
  num_epochs: 8000
  gradient_accumulate_every: 1
  # EMA destroys performance when used with BatchNorm
  # replace BatchNorm with GroupNorm.
  use_ema: True
  freeze_encoder: False
  # training loop control
  # in epochs
  rollout_every: 50
  checkpoint_every: 50
  val_every: 1
  sample_every: 5
  # steps per epoch
  max_train_steps: null
  max_val_steps: null
  # misc
  tqdm_interval_sec: 1.0

logging:
  project: diffusion_policy_debug
  resume: True
  mode: online
  name: ${now:%Y.%m.%d-%H.%M.%S}_${name}_${task_name}
  tags: ["${name}", "${task_name}", "${exp_name}"]
  id: null
  group: null

checkpoint:
  topk:
    monitor_key: test_mean_score
    mode: max
    k: 5
    format_str: 'epoch={epoch:04d}-test_mean_score={test_mean_score:.3f}.ckpt'
  save_last_ckpt: True
  save_last_snapshot: False

multi_run:
  run_dir: data/outputs/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}_${task_name}
  wandb_name_base: ${now:%Y.%m.%d-%H.%M.%S}_${name}_${task_name}

hydra:
  job:
    override_dirname: ${name}
  run:
    dir: data/outputs/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}_${task_name}
  sweep:
    dir: data/outputs/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}_${task_name}
    subdir: ${hydra.job.num}
